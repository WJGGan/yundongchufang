<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="PingFang SC, Microsoft YaHei, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#B0504F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="800" fill="#FAFAF8"/>

  <!-- ======================= 标题与图例 ======================= -->
  <text x="40" y="50" font-size="24" font-weight="700" fill="#111827">青少年运动处方系统 · 技术架构图</text>
  <text x="40" y="74" font-size="12.5" fill="#6B7280">两个阶段 · 两次 LLM 调用 · 安全由代码规则兜底 · 知识与动作由 RAG 外挂检索</text>

  <g font-size="11" fill="#374151">
    <rect x="880" y="38" width="12" height="12" rx="2" fill="#E8EEF7" stroke="#3B5B8C"/><text x="898" y="48">规则 / 代码</text>
    <rect x="990" y="38" width="12" height="12" rx="2" fill="#EFE7F7" stroke="#7C5CB0"/><text x="1008" y="48">LLM 调用</text>
    <rect x="1092" y="38" width="12" height="12" rx="2" fill="#E6F3EA" stroke="#3E7E55"/><text x="1110" y="48">RAG 检索</text>
    <rect x="1194" y="38" width="12" height="12" rx="2" fill="#FBF3E2" stroke="#A8803A"/><text x="1212" y="48">数据 / 产出</text>
    <rect x="1296" y="38" width="12" height="12" rx="2" fill="#FBEAEA" stroke="#B0504F"/><text x="1314" y="48">安全熔断</text>
  </g>

  <!-- ======================= 输入 ======================= -->
  <rect x="370" y="92" width="760" height="48" rx="8" fill="#FBF3E2" stroke="#A8803A"/>
  <text x="750" y="112" font-size="12.5" font-weight="600" fill="#713F12" text-anchor="middle">输入：学生健康档案（体检表＋体测表＋健康扩展层）</text>
  <text x="750" y="130" font-size="10.5" fill="#4B5563" text-anchor="middle">＋ 处方请求（目标 / 可用时间 / 场地 / 器械 / 偏好）</text>
  <line x1="750" y1="140" x2="750" y2="166" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ======================= 阶段一：健康档案理解 ======================= -->
  <rect x="40" y="170" width="1420" height="212" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="200" font-size="15" font-weight="700" fill="#1E3A5F">阶段一 · 健康档案理解</text>
  <text x="300" y="200" font-size="11.5" fill="#6B7280">原始档案 → 体质画像＋安全评估</text>

  <g>
    <rect x="64" y="226" width="200" height="84" rx="6" fill="#FBEAEA" stroke="#B0504F"/>
    <text x="164" y="250" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">① 急症熔断</text>
    <text x="164" y="270" font-size="10.5" fill="#4B5563" text-anchor="middle">24 个急症关键词扫描</text>
    <text x="164" y="287" font-size="10.5" fill="#4B5563" text-anchor="middle">规则先行，不经过模型</text>

    <rect x="300" y="226" width="260" height="84" rx="6" fill="#E6F3EA" stroke="#3E7E55"/>
    <text x="430" y="250" font-size="13" font-weight="600" fill="#14532D" text-anchor="middle">② RAG 检索（画像用）</text>
    <text x="430" y="270" font-size="10.5" fill="#4B5563" text-anchor="middle">学段过滤＋语义/词面混合排序＋健康保底配额</text>
    <text x="430" y="287" font-size="10.5" fill="#4B5563" text-anchor="middle">→ 相关知识卡片 ×6（全库 34 张）</text>

    <rect x="596" y="226" width="280" height="84" rx="6" fill="#EFE7F7" stroke="#7C5CB0"/>
    <text x="736" y="250" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">③ LLM 调用① · 档案理解</text>
    <text x="736" y="270" font-size="10.5" fill="#4B5563" text-anchor="middle">读档案＋知识卡片，输出结构化评估</text>
    <text x="736" y="287" font-size="10.5" fill="#4B5563" text-anchor="middle">结构校验失败 → 带错误清单重试 ×1</text>

    <rect x="912" y="226" width="320" height="84" rx="6" fill="#FBF3E2" stroke="#A8803A"/>
    <text x="1072" y="248" font-size="13" font-weight="600" fill="#713F12" text-anchor="middle">产出：体质画像 JSON</text>
    <text x="1072" y="268" font-size="10.5" fill="#4B5563" text-anchor="middle">五维等级 · 短板排序 · 健康关注 · 数据质量</text>
    <text x="1072" y="285" font-size="10.5" fill="#4B5563" text-anchor="middle">安全评估：禁忌动作标签＋强度上限＋能否开方</text>
    <text x="1072" y="302" font-size="10.5" fill="#4B5563" text-anchor="middle">结论附知识卡引用，可溯源</text>
  </g>
  <line x1="264" y1="268" x2="298" y2="268" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="268" x2="594" y2="268" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="876" y1="268" x2="910" y2="268" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="164" y1="310" x2="164" y2="336" stroke="#B0504F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="74" y="352" font-size="10.5" fill="#B0504F">命中急症词 → 返回固定就医模板，流程终止（不调用模型）</text>

  <!-- 阶段衔接 -->
  <line x1="750" y1="382" x2="750" y2="416" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="766" y="404" font-size="11" fill="#64748B">体质画像 ＋ 处方请求参数</text>

  <!-- ======================= 阶段二：运动处方生成 ======================= -->
  <rect x="40" y="420" width="1420" height="292" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="450" font-size="15" font-weight="700" fill="#1E3A5F">阶段二 · 运动处方生成</text>
  <text x="300" y="450" font-size="11.5" fill="#6B7280">画像＋请求 → 一人一策运动处方</text>

  <!-- Row 1 -->
  <g>
    <rect x="64" y="476" width="210" height="84" rx="6" fill="#FBEAEA" stroke="#B0504F"/>
    <text x="169" y="500" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">④ 安全闸门</text>
    <text x="169" y="520" font-size="10.5" fill="#4B5563" text-anchor="middle">依据阶段一的安全评估</text>
    <text x="169" y="537" font-size="10.5" fill="#4B5563" text-anchor="middle">判定不宜运动的档案在此拦截</text>

    <rect x="310" y="476" width="250" height="84" rx="6" fill="#E8EEF7" stroke="#3B5B8C"/>
    <text x="435" y="500" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">⑤ 动作候选硬过滤</text>
    <text x="435" y="520" font-size="10.5" fill="#4B5563" text-anchor="middle">禁忌标签 / 年龄 / 器械 / 场地（安全边界）</text>
    <text x="435" y="537" font-size="10.5" fill="#4B5563" text-anchor="middle">动作库 66 个 → 约 40-55 个安全候选</text>

    <rect x="596" y="476" width="300" height="84" rx="6" fill="#E6F3EA" stroke="#3E7E55"/>
    <text x="746" y="500" font-size="13" font-weight="600" fill="#14532D" text-anchor="middle">⑥ RAG 检索（处方用）</text>
    <text x="746" y="520" font-size="10.5" fill="#4B5563" text-anchor="middle">安全候选内按短板/目标/偏好排序截断 → 动作 ×30</text>
    <text x="746" y="537" font-size="10.5" fill="#4B5563" text-anchor="middle">知识卡领域配额＋目标卡钉选 → 知识卡 ×12</text>

    <rect x="932" y="476" width="300" height="84" rx="6" fill="#EFE7F7" stroke="#7C5CB0"/>
    <text x="1082" y="500" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">⑦ LLM 调用② · 处方生成（流式）</text>
    <text x="1082" y="520" font-size="10.5" fill="#4B5563" text-anchor="middle">FITT-VP＋7 天周计划＋营养＋风险＋解释引用</text>
    <text x="1082" y="537" font-size="10.5" fill="#4B5563" text-anchor="middle">校验问题 / 输出截断 → 重试 ×1</text>
  </g>
  <line x1="274" y1="518" x2="308" y2="518" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="518" x2="594" y2="518" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="896" y1="518" x2="930" y2="518" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="169" y1="560" x2="169" y2="586" stroke="#B0504F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="74" y="602" font-size="10.5" fill="#B0504F">不宜开方 → 仅输出转介建议，流程终止</text>

  <!-- 换行连接 ⑦ → ⑧ -->
  <polyline points="1082,560 1082,582 540,582 540,612" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g>
    <rect x="390" y="616" width="300" height="80" rx="6" fill="#E8EEF7" stroke="#3B5B8C"/>
    <text x="540" y="638" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">⑧ 校验＋回填</text>
    <text x="540" y="658" font-size="10.5" fill="#4B5563" text-anchor="middle">动作 ID 越界/禁忌 · 周计划 7 天完整 · 时长约束 · 解释数</text>
    <text x="540" y="675" font-size="10.5" fill="#4B5563" text-anchor="middle">动作详情与替代方案从动作库回填，不由模型生成</text>

    <rect x="726" y="616" width="320" height="80" rx="6" fill="#FBF3E2" stroke="#A8803A"/>
    <text x="886" y="638" font-size="13" font-weight="600" fill="#713F12" text-anchor="middle">产出：运动处方 JSON</text>
    <text x="886" y="658" font-size="10.5" fill="#4B5563" text-anchor="middle">周计划 · 强度控制 · 营养 · 风险注记 · 逐条解释引用</text>
    <text x="886" y="675" font-size="10.5" fill="#4B5563" text-anchor="middle">附免责声明与资产版本号，流式推送前端</text>
  </g>
  <line x1="690" y1="656" x2="724" y2="656" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ======================= 底部实测指标 ======================= -->
  <rect x="40" y="730" width="1420" height="46" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="60" y="749" font-size="11" fill="#374151">实测：输入 token −41%（画像 −53%｜处方 −34%）· 检索针对性召回：画像 95% / 处方 79% · 检索开销 ≈0.7s/请求</text>
  <text x="60" y="767" font-size="11" fill="#374151">总耗时与全量注入持平（瓶颈在输出解码）· 等待时间杠杆＝关闭思考：完整流程 404s → 84s</text>
</svg>
